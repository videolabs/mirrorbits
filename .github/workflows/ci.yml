name: test

on:
  push:
  pull_request:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        go-version: [1.18, 1.24, 'stable']

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build
      run: |
        make

    - name: Run tests
      run: |
        make test

    - name: Create release tarball
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        make release

    - uses: actions/upload-artifact@v4
      if: startsWith(github.ref, 'refs/tags/')
      with:
        name: release-${{ matrix.go-version }}
        path: dist/*

  docker:
    name: Docker image
    runs-on: ubuntu-22.04

    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Build
      run: |
        docker build -t mirrorbits .

    - name: Run
      run: |
        # without a daemon, `version` prints the client version then exits 1
        out=$(docker run --rm mirrorbits version 2>&1 || true)
        echo "$out"
        echo "$out" | grep -q 'Version:'
